[project]
name = "datacheck-backend"
version = "0.1.0"
description = "DataCheck - AI Data Query Agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "sqlglot>=20.0.0",
    "faker>=25.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "langgraph>=0.2.0",
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "slowapi>=0.1.9",
    "asyncmy>=0.2.9",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
