scan_success_rate:
  name: 扫描成功率
  description: 各类扫描的成功率统计
  allowed_dimensions:
    - date
    - scan_type
    - device_type
    - error_type
  default_dimension: date
  max_time_range_days: 90
  allowed_query_types:
    - fact
    - trend
    - breakdown
    - comparison
    - anomaly_breakdown
  roles:
    - admin
    - tester
    - product
  permitted_tables:
    - scan_records
  sensitive_fields:
    - phone
    - id_card
  chart:
    trend:
      type: line
      x_field: date
      y_fields: [success_rate]
      labels:
        success_rate: 扫描成功率 (%)
      value_format: percent
    breakdown:
      type: bar
      x_field: dimension_value
      y_fields: [success_rate]
      labels:
        success_rate: 成功率 (%)
        dimension_value: 维度
      value_format: percent
    fact:
      type: stat
      y_fields: [success_rate]
      labels:
        success_rate: 成功率 (%)
      value_format: percent
  sql_templates:
    trend: >
      SELECT
        DATE({{ table }}.created_at) AS {{ dimension }},
        ROUND(SUM(CASE WHEN {{ table }}.status = 'success' THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS success_rate,
        COUNT(*) AS total_count,
        SUM(CASE WHEN {{ table }}.status = 'success' THEN 1 ELSE 0 END) AS success_count
      FROM {{ table }}
      WHERE {{ table }}.created_at >= :start_time
        AND {{ table }}.created_at < :end_time
        {% if filters.scan_type %}
        AND {{ table }}.scan_type = :scan_type
        {% endif %}
        {% if filters.device_type %}
        AND {{ table }}.device_type = :device_type
        {% endif %}
        AND {{ table }}.workspace_id = :workspace_id
      GROUP BY {{ group_by }}
      ORDER BY {{ dimension }} ASC
      LIMIT :limit
    fact: >
      SELECT
        ROUND(SUM(CASE WHEN {{ table }}.status = 'success' THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS success_rate,
        COUNT(*) AS total_count,
        SUM(CASE WHEN {{ table }}.status = 'success' THEN 1 ELSE 0 END) AS success_count,
        SUM(CASE WHEN {{ table }}.status = 'failed' THEN 1 ELSE 0 END) AS failed_count
      FROM {{ table }}
      WHERE {{ table }}.created_at >= :start_time
        AND {{ table }}.created_at < :end_time
        {% if filters.scan_type %}
        AND {{ table }}.scan_type = :scan_type
        {% endif %}
        AND {{ table }}.workspace_id = :workspace_id
      LIMIT :limit
    breakdown: >
      SELECT
        {{ table }}.{{ dimension }} AS dimension_value,
        ROUND(SUM(CASE WHEN {{ table }}.status = 'success' THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS success_rate,
        COUNT(*) AS total_count,
        SUM(CASE WHEN {{ table }}.status = 'success' THEN 1 ELSE 0 END) AS success_count
      FROM {{ table }}
      WHERE {{ table }}.created_at >= :start_time
        AND {{ table }}.created_at < :end_time
        AND {{ table }}.workspace_id = :workspace_id
      GROUP BY {{ table }}.{{ dimension }}
      ORDER BY total_count DESC
      LIMIT :limit
    comparison: >
      SELECT
        CASE
          WHEN {{ table }}.created_at >= :prev_start_time AND {{ table }}.created_at < :start_time THEN '对比期'
          ELSE '当期'
        END AS period,
        ROUND(SUM(CASE WHEN {{ table }}.status = 'success' THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS success_rate,
        COUNT(*) AS total_count
      FROM {{ table }}
      WHERE {{ table }}.created_at >= :prev_start_time
        AND {{ table }}.created_at < :end_time
        AND {{ table }}.workspace_id = :workspace_id
      GROUP BY period
      ORDER BY period ASC
      LIMIT :limit
  name: 扫描次数
  description: 扫描次数统计
  allowed_dimensions:
