supplier_win_rate:
  name: 供应商中标率
  description: 供应商报价中标次数 / 参与报价次数
  allowed_dimensions:
    - supplier_name
    - date
  default_dimension: supplier_name
  max_time_range_days: 366
  allowed_query_types:
    - fact
    - breakdown
  roles:
    - admin
    - operator
    - product
  permitted_tables:
    - tb_order_quotes
  table_aliases:
    main: tb_order_quotes
    quotes: tb_order_quotes
  sensitive_fields: []
  chart:
    breakdown:
      type: bar
      x_field: dimension_value
      y_fields: [win_rate]
      labels:
        win_rate: 中标率 (%)
      value_format: percent
  sql_templates:
    fact: >
      SELECT
        supplier_name,
        COUNT(*) AS quote_count,
        SUM(is_winner) AS win_count,
        ROUND(SUM(is_winner) * 100.0 / NULLIF(COUNT(*), 0), 2) AS win_rate
      FROM {{ quotes }}
      WHERE created_at >= :start_time
        AND created_at < :end_time
        AND workspace_id = :workspace_id
      GROUP BY supplier_name
      HAVING quote_count >= 20
      ORDER BY win_rate DESC
      LIMIT :limit
    breakdown: >
      SELECT
        {{ quotes }}.{{ dimension }} AS dimension_value,
        COUNT(*) AS quote_count,
        SUM({{ quotes }}.is_winner) AS win_count,
        ROUND(SUM({{ quotes }}.is_winner) * 100.0 / NULLIF(COUNT(*), 0), 2) AS win_rate
      FROM {{ quotes }}
      WHERE {{ quotes }}.created_at >= :start_time
        AND {{ quotes }}.created_at < :end_time
        AND {{ quotes }}.workspace_id = :workspace_id
      GROUP BY {{ quotes }}.{{ dimension }}
      HAVING quote_count >= 20
      ORDER BY win_rate DESC
      LIMIT :limit

